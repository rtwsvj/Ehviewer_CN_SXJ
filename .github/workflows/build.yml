name: Android CI

on:
  push:
    branches:
      - BiLi_PC_Gamer
      - 'codex/**'
  pull_request:
    branches:
      - BiLi_PC_Gamer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Lint
        run: |
          chmod +x ./gradlew
          ./gradlew app:lintAppReleaseDebug --stacktrace

      - name: Unit tests
        run: ./gradlew app:testAppReleaseDebugUnitTest --stacktrace

      - name: Build
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: ./app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: ./app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: ./app/build/outputs/apk/

  instrumentation:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 29, 33, 35]
    env:
      TARGET_INSTRUMENTATION_CLASSES: >-
        com.hippo.ehviewer.client.SecureCookieStorageDeviceTest,
        com.hippo.ehviewer.client.WebViewCookieBridgeDeviceTest,
        com.hippo.ehviewer.client.RequestGovernorMockServerDeviceTest,
        com.hippo.ehviewer.download.DownloadLimitSignalDeviceTest,
        com.hippo.ehviewer.util.MediaStoreVisibilityDeviceTest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${{ matrix.api-level }}" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358" \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ matrix.api-level }}-google-apis-x86-64-v1

      - name: Prepare instrumentation class filter
        run: |
          echo "TEST_CLASSES=$(printf "%s" "${TARGET_INSTRUMENTATION_CLASSES}" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedAppReleaseDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="${TEST_CLASSES}" -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Verify instrumentation coverage
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys
          import xml.etree.ElementTree as ET

          api_level = int(os.environ["API_LEVEL"])
          expected = {
              "com.hippo.ehviewer.client.SecureCookieStorageDeviceTest",
              "com.hippo.ehviewer.client.WebViewCookieBridgeDeviceTest",
              "com.hippo.ehviewer.client.RequestGovernorMockServerDeviceTest",
              "com.hippo.ehviewer.download.DownloadLimitSignalDeviceTest",
          }
          min_tests = 7
          if api_level >= 29:
              expected.add("com.hippo.ehviewer.util.MediaStoreVisibilityDeviceTest")
              min_tests = 9
          allowed_skipped_classes = set()
          if api_level < 29:
              allowed_skipped_classes.add(
                  "com.hippo.ehviewer.util.MediaStoreVisibilityDeviceTest")
          result_root = Path("app/build/outputs/androidTest-results/connected")
          result_files = sorted(result_root.rglob("*.xml"))
          if not result_files:
              print(f"No connected instrumentation XML found under {result_root}", file=sys.stderr)
              sys.exit(1)

          classes = set()
          tests = failures = errors = skipped = unexpected_skips = 0
          for result_file in result_files:
              tree = ET.parse(result_file)
              for case in tree.iter("testcase"):
                  tests += 1
                  class_name = case.attrib.get("classname", "")
                  if class_name:
                      classes.add(class_name)
                  failures += len(case.findall("failure"))
                  errors += len(case.findall("error"))
                  skipped_nodes = case.findall("skipped")
                  skipped += len(skipped_nodes)
                  if skipped_nodes and class_name not in allowed_skipped_classes:
                      unexpected_skips += len(skipped_nodes)

          missing = sorted(expected - classes)
          executed = tests - skipped
          print(f"Instrumentation XML files: {len(result_files)}")
          print(f"Instrumentation tests: total={tests}, executed={executed}, failures={failures}, errors={errors}, skipped={skipped}")
          print("Instrumentation classes:")
          for class_name in sorted(classes):
              print(f"  {class_name}")

          if executed < min_tests:
              print(f"Expected at least {min_tests} executed test cases, found {executed}", file=sys.stderr)
              sys.exit(1)
          if missing:
              print("Missing expected instrumentation classes:", file=sys.stderr)
              for class_name in missing:
                  print(f"  {class_name}", file=sys.stderr)
              sys.exit(1)
          if failures or errors:
              print("Connected instrumentation XML contains failures/errors", file=sys.stderr)
              sys.exit(1)
          if unexpected_skips:
              print("Expected targeted instrumentation tests to run, but XML contains unexpected skipped tests", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            ./app/build/outputs/androidTest-results/connected/
            ./app/build/reports/androidTests/connected/
          if-no-files-found: ignore
