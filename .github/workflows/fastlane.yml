name: Validate Fastlane metadata

on:
  workflow_dispatch:
  push:
    branches:
      - BiLi_PC_Gamer
      - 'codex/**'
  pull_request:
    branches:
      - BiLi_PC_Gamer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Fastlane Supply Metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@d7dd83eb37e3312d33f58b99e4e91d369347563c # v2.0.0
