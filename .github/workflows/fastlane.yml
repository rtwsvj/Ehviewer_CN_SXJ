  workflow_dispatch:
  push:
    branches:
      - BiLi_PC_Gamer
      - 'codex/**'
  pull_request:
    branches:
      - BiLi_PC_Gamer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
